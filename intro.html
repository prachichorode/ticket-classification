<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Support</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071a3d,
                    #0b3b78,
                    #1266b3
                );

            color: white;
        }


        /* MAIN INTRO */

        .intro {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;
        }


        /* BACKGROUND CIRCLES */

        .circle {
            position: absolute;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.06);

            animation: float 6s infinite ease-in-out;
        }

        .circle1 {
            width: 400px;
            height: 400px;

            top: -180px;
            left: -100px;
        }

        .circle2 {
            width: 300px;
            height: 300px;

            bottom: -120px;
            right: -80px;

            animation-delay: 1s;
        }

        .circle3 {
            width: 180px;
            height: 180px;

            top: 30%;
            right: 15%;

            animation-delay: 2s;
        }


        /* CONTENT */

        .intro-content {
            text-align: center;

            position: relative;

            z-index: 2;

            animation: fadeIn 1s ease;
        }


        /* TICKET ICON */

        .ticket-icon {

            width: 100px;
            height: 100px;

            margin: auto;
            margin-bottom: 25px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.2);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 55px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);

            animation: ticketFloat 2s infinite ease-in-out;
        }


        /* TITLE */

        .title {

            font-size: 52px;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }


        .title span {
            color: #60c8ff;
        }


        .subtitle {

            font-size: 20px;

            color: #d8ecff;

            margin-bottom: 40px;
        }


        /* FEATURES */

        .features {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 45px;
        }


        .feature {

            min-width: 180px;

            padding: 18px 20px;

            background: rgba(255, 255, 255, 0.09);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 15px;

            backdrop-filter: blur(10px);

            animation: featureUp 1s ease forwards;

            opacity: 0;
        }


        .feature:nth-child(1) {
            animation-delay: 0.3s;
        }

        .feature:nth-child(2) {
            animation-delay: 0.6s;
        }

        .feature:nth-child(3) {
            animation-delay: 0.9s;
        }


        .feature-icon {

            font-size: 28px;

            margin-bottom: 8px;
        }


        .feature h3 {

            font-size: 15px;

            margin-bottom: 5px;
        }


        .feature p {

            font-size: 12px;

            color: #c5ddf5;
        }


        /* ENTER TEXT */

        .enter-text {

            font-size: 14px;

            color: #d5eaff;

            animation: pulse 1.5s infinite;
        }


        /* ANIMATIONS */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes featureUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes ticketFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

        }


        @keyframes float {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, -20px);
            }

        }


        @keyframes pulse {

            0%, 100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            .features {
                flex-direction: column;
                gap: 10px;
            }

            .feature {
                min-width: 220px;
            }

        }

    </style>

</head>


<body>


<div class="intro">


    <!-- BACKGROUND CIRCLES -->

    <div class="circle circle1"></div>

    <div class="circle circle2"></div>

    <div class="circle circle3"></div>


    <!-- CONTENT -->

    <div class="intro-content">


        <!-- TICKET -->

        <div class="ticket-icon">
            🎫
        </div>


        <!-- TITLE -->

        <h1 class="title">
            AI <span>Support</span>
        </h1>


        <p class="subtitle">
            Customer Support & Ticket Management System
        </p>


        <!-- FEATURES -->

        <div class="features">


            <div class="feature">

                <div class="feature-icon">
                    🎫
                </div>

                <h3>
                    Smart Tickets
                </h3>

                <p>
                    Create and manage support tickets
                </p>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    🤖
                </div>

                <h3>
                    AI Classification
                </h3>

                <p>
                    Automatic category & priority prediction
                </p>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    ⚡
                </div>

                <h3>
                    Faster Support
                </h3>

                <p>
                    Track and resolve customer issues
                </p>

            </div>


        </div>


        <p class="enter-text">
            Preparing your support workspace...
        </p>


    </div>


</div>


<script>

    /*
       After 3 seconds,
       automatically open Login Page.
    */

    setTimeout(function() {

        window.location.href = "{{ url_for('login') }}";

    }, 3000);

</script>


</body>

</html>
